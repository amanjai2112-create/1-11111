:root{--card:linear-gradient(150deg,rgba(255,255,255,.74),rgba(255,255,255,.36));--shadow:0 18px 50px -18px rgba(60,50,150,.28),0 2px 6px rgba(60,50,150,.06)}

body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:70vmax;height:70vmax;border-radius:50%;opacity:.6}
body::before{left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--o1),transparent 65%);animation:drift1 40s ease-in-out infinite alternate}
body::after{right:-26vmax;bottom:-32vmax;background:radial-gradient(circle,var(--o3),transparent 65%);animation:drift2 48s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(1.2)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}

/* ===== v11 modern redesign overlay ===== */
:root{
  --a1:#6a4cff;--a2:#18b6ff;--a3:#ff5fa8;
  --o1:rgba(106,76,255,.40);--o2:rgba(24,182,255,.34);--o3:rgba(255,95,168,.28);
  --r-lg:26px;--r-md:18px;
}
body{
  background:
   radial-gradient(60vmax 46vmax at 0% -8%,var(--o1),transparent 62%),
   radial-gradient(52vmax 42vmax at 108% 12%,var(--o2),transparent 62%),
   radial-gradient(56vmax 50vmax at 20% 110%,var(--o3),transparent 62%),
   var(--bg);background-attachment:fixed;
}
/* subtle dotted texture */
body::selection{background:var(--accent-soft)}
#app{position:relative}
#app::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(106,76,255,.16) 1px,transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}

/* header: floating glass bar with gradient accent line */
.top{border-radius:0 0 28px 28px;border-bottom:0;position:sticky}
.top::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:2px;border-radius:99px;
  background:linear-gradient(90deg,transparent,var(--a1),var(--a3),var(--a2),transparent);opacity:.85}
.top .ttl{font-size:21px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--text) 30%,var(--a1) 75%,var(--a3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ib{border-radius:15px;width:40px;height:40px}
.hbtn{background:linear-gradient(135deg,var(--a1),var(--a3) 60%,var(--a2));background-size:140% 140%;box-shadow:0 10px 22px -8px var(--a1),inset 0 1px 0 rgba(255,255,255,.45)}
.tab.on{background:linear-gradient(135deg,var(--a1),var(--a2))}

/* cards */
.card{border-radius:var(--r-lg);box-shadow:var(--shadow),inset 0 1px 0 var(--hi),inset 0 0 0 1px rgba(255,255,255,.12)}
.card h2{font-weight:800}

/* subject cards: bold gradient art tile + orbit decoration */
.subj{padding:20px 18px;gap:18px;border-radius:28px}
.subj::before{width:220px;height:220px;right:-70px;top:-90px;opacity:.5;
  background:radial-gradient(circle,var(--a2),transparent 66%)}
.subj::after{content:"";position:absolute;right:16px;bottom:14px;width:74px;height:74px;border-radius:50%;
  border:1.5px dashed var(--a1);opacity:.22;pointer-events:none}
.subj .ic{width:72px;height:72px;border-radius:24px;
  background:linear-gradient(145deg,var(--a1),var(--a2));
  box-shadow:0 16px 28px -10px var(--a1),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.14)}
.subj .n{font-size:21px;font-weight:800}
.subj .d{font-size:12.5px}
.subj .d+.d{margin-top:4px;display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--a1);font-weight:700;font-size:11.5px}
.subj:hover{transform:translateY(-4px) scale(1.01)}
.dppcard{background:linear-gradient(135deg,rgba(106,76,255,.22),rgba(255,95,168,.16) 55%,rgba(24,182,255,.2)),var(--card)}

/* chapter rows */
.ch{border-radius:22px;padding:13px 16px 16px}
.ch .num{width:50px;height:50px;border-radius:16px;font-size:13px}
.ch .pg{height:5px;background:linear-gradient(90deg,var(--ok),var(--a2),var(--a1))}
.unit{font-size:18px;margin-top:26px}
.unit::before{width:6px;height:22px;background:linear-gradient(var(--a1),var(--a3))}

/* stats: ring look */
.stat .c{width:66px;height:66px;font-size:16px;border-width:4px;
  background:linear-gradient(var(--glass-s),var(--glass-s)) padding-box,conic-gradient(from 200deg,var(--a1),var(--a3),var(--a2),var(--a1)) border-box;
  box-shadow:0 12px 22px -10px var(--a1)}
.stat .l{margin-top:2px;font-size:12px;letter-spacing:.02em}

/* buttons */
.btn{border-radius:16px;font-weight:800;letter-spacing:.01em;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 12px 24px -10px var(--a1),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card)}
.fab{padding:16px 26px;font-size:15.5px;background:linear-gradient(135deg,var(--a1),var(--a3) 60%,var(--a2));box-shadow:0 18px 34px -10px var(--a1),inset 0 1px 0 rgba(255,255,255,.55)}
.fab::before{content:"✦";margin-right:2px}

/* quiz */
.pbar{height:10px;background:var(--accent-soft)}
.pbar i{background:linear-gradient(90deg,var(--a1),var(--a3),var(--a2));position:relative}
.pbar i::after{content:"";position:absolute;right:0;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(40%,-50%);background:#fff;box-shadow:0 0 0 3px var(--a1),0 0 14px var(--a1)}
.qleft{border-radius:30px}
.qchip{background:linear-gradient(135deg,var(--accent-soft),transparent);font-weight:800}
.opt{border-radius:20px;border-width:1.5px}
.opt .l{background:linear-gradient(145deg,var(--accent-soft),transparent);box-shadow:inset 0 1px 0 var(--hi)}
.opt.sel{background:linear-gradient(135deg,var(--accent-soft),transparent),var(--card)}
.opt.ok{background:linear-gradient(135deg,var(--ok-soft),transparent),var(--card);animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}

    var ok=await txPut([[SP+k+'|__idx',idx]],dels.concat(legacy?[k]:[]));
    if(ok){ dels.forEach(function(sk){ delete prev[sk]; }); MS.shOk[k]=1; MS.mono[k]=0; }
    return ok; }
  function writeKey(k){ return new Promise(function(res){

      var once=function(){ return SH[k]?(MS.q[k]=(MS.q[k]||Promise.resolve()).then(function(){ return writeSharded(k); },function(){ return writeSharded(k); })):idbPut(k,MS.mem[k]); };

  MS.put=function(k){ MS.dirty[k]=true; clearTimeout(MS.timer); MS.timer=setTimeout(function(){ MS.flush(); },250); };
